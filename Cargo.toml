[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.2.3"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.96"
repository = "https://github.com/method-production-suite/method-launcher"

[workspace.dependencies]
launcher-core = { path = "crates/core" }
launcher-sys = { path = "crates/sys" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
egui = "0.37"
sha2 = "0.11"
minisign-verify = "0.2"
# method-libs: the suite's updater, pinned to one reviewed revision (fa7d430, method-libs#14 on
# #12: the update's code signature is checked against the running app's team before the swap;
# an offer older than one already accepted is refused; and when an administrator swaps, root
# prepares and checks its copy in a private folder and what it puts in place belongs to root),
# so the launcher updates itself the way the apps do (SUITE-STANDARDS.md §1).
method-update = { git = "https://github.com/method-production-suite/method-libs", rev = "fa7d430e17b56f0776b9bb64396cdc90e251230f" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
dbg_macro = "warn"

# Smaller dev builds (the suite's disk rule, 2026-10-21): line tables only for our crates,
# no debug info for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
