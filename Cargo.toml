[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/method-production-suite/method-launcher"

[workspace.dependencies]
launcher-core = { path = "crates/core" }
launcher-sys = { path = "crates/sys" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
egui = "0.36"
sha2 = "0.11"
# method-libs: the suite's updater, pinned to one reviewed revision (25c80f8, method-libs#7,
# which updates Intel Macs too), so the launcher updates itself the way the apps do
# (SUITE-STANDARDS.md §1).
method-update = { git = "https://github.com/method-production-suite/method-libs", rev = "25c80f8cfcc2e5222de4c5b79413a9de488196af" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
dbg_macro = "warn"

[profile.dev.package."*"]
opt-level = 2
