[package]
name = "method-launcher"
description = "Method Launcher: install, open and keep track of the Method Production Suite's apps"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
repository.workspace = true

[[bin]]
name = "method-launcher-app"
path = "src/main.rs"

[lints]
workspace = true

[features]
# An update rehearsal: bakes a local endpoint, a throwaway key and plain HTTP from
# METHOD_LAUNCHER_UPDATE_ENDPOINT, _PUBKEY and _INSECURE (build.rs refuses them otherwise).
rehearsal = []

[dependencies]
launcher-core = { workspace = true }
launcher-sys = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
png = "0.18"
serde_json = { workspace = true }
method-update = { workspace = true }

[dev-dependencies]
# Draws the window to an image with no window, for the pictures test in src/screens.rs.
egui_kittest = { version = "=0.36.2", features = ["eframe", "wgpu"] }
