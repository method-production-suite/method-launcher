name: weekly
# CI, ArtCraft-style (SUITE-STANDARDS.md §6): nothing builds on pull requests or pushes
# (ci.yml runs only the dependency checks); this builds and tests main on all four systems
# every Monday, and saves every system's cache. A scheduled run skips itself when main
# hasn't changed since the last green weekly. A manual run always builds: before tagging, run
# it by hand on the release commit.
on:
  schedule:
    - cron: "41 7 * * 1"
  workflow_dispatch:
concurrency:
  group: weekly-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
jobs:
  changed:
    # Whether main moved since the last green weekly.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          build=true
          if [ "$EVENT" = schedule ]; then
            # A failed lookup fails this job, so a weekly never skips by mistake.
            last="$(gh api "repos/$REPO/actions/workflows/weekly.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')"
            if [ "$last" = "$SHA" ]; then
              build=false
              echo "main is still $SHA, which already has a green weekly."
            fi
          fi
          echo "build=$build" | tee -a "$GITHUB_OUTPUT"
  gates:
    needs: changed
    if: needs.changed.outputs.build == 'true'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # The launcher's four systems: Linux x86_64 and arm64, Apple silicon macOS, Windows x64.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux packages for eframe
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev
      # The only place caches are saved, on every system.
      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask ci
  live-signatures:
    # Every week, whether or not main moved: each app's latest release, fetched the way an
    # install fetches it, must carry SHA256SUMS signed with that app's key built into the
    # launcher. The apps release on their own schedule, so a key change or a broken
    # signature shows up here before anyone's install is refused.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked -p launcher-sys --lib live_ -- --ignored --nocapture
  linux-install:
    # A real install on Linux, every week whether or not main moved: the command line
    # installs Method Reader and Method Budget as AppImages from their latest releases
    # (fetched, checked against the signed checksums, staged and renamed into place), then
    # Method Reader again over itself, the way an update runs. Headless: nothing is opened.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: FUSE, which an AppImage needs to run
        run: sudo apt-get update && sudo apt-get install -y fuse3
      - run: cargo build --locked -p launcher-cli
      - name: Install, update, and check what is installed
        run: |
          set -euo pipefail
          bin=target/debug/method-launcher
          "$bin" install reader
          "$bin" install budget
          "$bin" install reader
          "$bin" status | tee status.txt
          for app in Reader Budget; do
            slug="${app,,}"
            test -x "$HOME/Applications/Method-$app.AppImage"
            grep -E "^$slug +installed [0-9]+\.[0-9]+\.[0-9]+ at $HOME/Applications/Method-$app.AppImage$" status.txt
            # The menu entry is named after the bundle id, which itself ends in .desktop.
            test -s "$HOME/.local/share/applications/com.method$slug.desktop.desktop"
          done
          # No staging copy is left behind.
          if ls -A "$HOME/Applications" | grep -q installing; then ls -la "$HOME/Applications"; exit 1; fi
  alert:
    # A scheduled run that fails opens an issue, or comments on the one already open, so a
    # failure nobody is watching for still gets seen (the owner, 2026-11-17).
    needs: [changed, gates, live-signatures, linux-install]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          n=$(gh issue list --state open --search 'in:title "Weekly build failed"' --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue comment "$n" --body "Failed again: $RUN"; else gh issue create --title "Weekly build failed" --body "Run: $RUN"; fi
