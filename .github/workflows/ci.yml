name: ci
# CI, ArtCraft-style (SUITE-STANDARDS.md §6): pull requests and pushes to main run only the
# quick dependency checks, `cooldown` (crate ages) and `deny`, the two checks main requires.
# Nothing is built or tested here: the session runs `cargo xtask ci` on its own Mac before
# marking a pull request ready, weekly.yml builds and tests main on every system each Monday,
# and every release builds and tests before anything is signed. The weekly schedule below
# repeats the two checks, since crates and advisories change without a push.
#
# Pull requests open as drafts and check nothing until marked ready. Changes to
# documentation alone skip both checks. Both skips use `if:`, never `paths-ignore`, so the
# required checks still report (a skipped job counts as passing).
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "23 6 * * 1"
# A newer push cancels an older run, on a pull request and on main alike; the weekly run has
# its own group, so a push never cancels it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  changes:
    # Decides whether this run checks anything. Drafts check nothing (this job is skipped,
    # and so is every job that needs it). A pull request that changes only documentation
    # (`*.md`, `docs/`, `site/`, `LICENSE*`) skips both checks. Pushes to main and the weekly
    # run always check.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      checks: ${{ steps.decide.outputs.checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          rust=true
          if [ "$EVENT" = pull_request ]; then
            # Fails closed: a failed diff stops this job (and so every build), and an empty
            # list builds.
            files="$(git diff --name-only "$BASE...$HEAD")"
            if [ -n "$files" ]; then
              rust=false
              while IFS= read -r file; do
                case "$file" in
                  *.md|docs/*|site/*|LICENSE*) ;;
                  *) rust=true ;;
                esac
              done <<< "$files"
            fi
          fi
          echo "checks=$rust" | tee -a "$GITHUB_OUTPUT"
  cooldown:
    # Fails on crates published less than 14 days ago (scripts/check-crate-ages.py).
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check crate ages
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # A pull request checks only what it adds or bumps against main. Every push to main
          # and the weekly run check the whole lock (SUITE-STANDARDS.md §6).
          # When method-libs comes in (pinned by full commit), add
          # --allow-git https://github.com/method-production-suite/method-libs to both lines.
          if [ "$EVENT" = pull_request ]; then
            python3 scripts/check-crate-ages.py --only-changed origin/main
          else
            python3 scripts/check-crate-ages.py
          fi
  deny:
    # deny.toml: known advisories, licences compatible with MIT OR Apache-2.0, known sources.
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # deny.toml's `# ignore-expires:` date; fails once it has passed while the ignores it
      # covers are still listed.
      - run: python3 scripts/check-ignore-expiry.py
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
