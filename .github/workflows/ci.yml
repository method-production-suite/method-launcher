name: ci
# Lean CI (SUITE-STANDARDS.md §6). Pull requests build and test on Linux, x86_64 and arm64,
# and run the crate-age and deny checks. A push to main runs only the whole-lock crate-age
# check and deny (its code was built as a pull request); the weekly run repeats those two,
# since crates and advisories change without a push. Every system builds once a night in
# nightly.yml, and on every release.
#
# Pull requests open as drafts and build nothing; marking one ready for review starts the
# full run. Changes to documentation alone skip the Rust jobs. Both skips use `if:`, never
# `paths-ignore`, so the required checks still report (a skipped job counts as passing).
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "23 6 * * 1"
# A newer push cancels an older run, on a pull request and on main alike; the weekly run has
# its own group, so a push never cancels it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
permissions:
  contents: read
# Lean builds (SUITE-STANDARDS.md §6): no incremental state, and line tables only for debug
# info, so caches stay small. Installers aren't built here; when the release workflow
# lands, they build on main, on releases, and on pull requests that touch packaging.
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
jobs:
  changes:
    # Decides what this run does. Drafts do nothing (this job is skipped, and so is every job
    # that needs it). A pull request that changes only documentation (`*.md`, `docs/`,
    # `site/`, `LICENSE*`) skips every Rust job. A push to main and the weekly run check
    # crates and advisories only (`gates` false, `checks` true).
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      gates: ${{ steps.decide.outputs.gates }}
      checks: ${{ steps.decide.outputs.checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          rust=true
          if [ "$EVENT" = pull_request ]; then
            # Fails closed: a failed diff stops this job (and so every build), and an empty
            # list builds.
            files="$(git diff --name-only "$BASE...$HEAD")"
            if [ -n "$files" ]; then
              rust=false
              while IFS= read -r file; do
                case "$file" in
                  *.md|docs/*|site/*|LICENSE*) ;;
                  *) rust=true ;;
                esac
              done <<< "$files"
            fi
          fi
          if [ "$EVENT" = pull_request ]; then
            gates="$rust"
            checks="$rust"
          else
            gates=false
            checks=true
          fi
          { echo "gates=$gates"; echo "checks=$checks"; } | tee -a "$GITHUB_OUTPUT"
  gates-linux-x86_64:
    # Named as main's required checks expect. One job per runner rather than a matrix: a
    # matrix skipped by `if:` reports one unexpanded check, and the required ones would wait.
    name: gates (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.gates == 'true'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux packages for eframe
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev
      # Pull requests only restore the cache; nightly.yml saves it, so the org stays under
      # GitHub's cache limit (SUITE-STANDARDS.md §6).
      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
        with:
          save-if: false
      - run: cargo xtask ci
  gates-linux-arm64:
    # Named as main's required checks expect. One job per runner rather than a matrix: a
    # matrix skipped by `if:` reports one unexpanded check, and the required ones would wait.
    name: gates (ubuntu-24.04-arm)
    needs: changes
    if: needs.changes.outputs.gates == 'true'
    timeout-minutes: 60
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux packages for eframe
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev
      # Pull requests only restore the cache; nightly.yml saves it, so the org stays under
      # GitHub's cache limit (SUITE-STANDARDS.md §6).
      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
        with:
          save-if: false
      - run: cargo xtask ci
  cooldown:
    # Fails on crates published less than 14 days ago (scripts/check-crate-ages.py).
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check crate ages
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # A pull request checks only what it adds or bumps against main. Every push to main
          # and the weekly run check the whole lock (SUITE-STANDARDS.md §6).
          # When method-libs comes in (pinned by full commit), add
          # --allow-git https://github.com/method-production-suite/method-libs to both lines.
          if [ "$EVENT" = pull_request ]; then
            python3 scripts/check-crate-ages.py --only-changed origin/main
          else
            python3 scripts/check-crate-ages.py
          fi
  deny:
    # deny.toml: known advisories, licences compatible with MIT OR Apache-2.0, known sources.
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # deny.toml's `# ignore-expires:` date; fails once it has passed while the ignores it
      # covers are still listed.
      - run: python3 scripts/check-ignore-expiry.py
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
